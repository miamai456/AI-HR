services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Copy .env.example to .env first}
      MYSQL_USER: ${MYSQL_USER:?Copy .env.example to .env first}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Copy .env.example to .env first}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Copy .env.example to .env first}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      AIHR_ENVIRONMENT: docker
      AIHR_DATABASE_URL: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}?charset=utf8mb4
      AIHR_SEED_DEMO_DATA: "true"
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 5s
      timeout: 5s
      retries: 20

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.app
    environment:
      AIHR_API_URL: http://api:8000/api/v1
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy

volumes:
  mysql_data:
