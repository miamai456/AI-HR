services:
  cache:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - E:/AIHRData/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${AIHR_POSTGRES_DATABASE:-aihr}
      POSTGRES_USER: ${AIHR_POSTGRES_USER:-aihr}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    ports:
      - "127.0.0.1:${AIHR_POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - E:/AIHRData/postgres:/var/lib/postgresql/data
      - E:/AIHRData/secrets/postgres_password:/run/secrets/postgres_password:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 10s

  mongo:
    image: mongo:8.0
    ports:
      - "127.0.0.1:${AIHR_MONGO_HOST_PORT:-27017}:27017"
    volumes:
      - E:/AIHRData/mongodb:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  api:
    image: aihr-api:local
    pull_policy: build
    build:
      context: .
      dockerfile: Dockerfile.api
      args:
        RUNTIME_IMAGE: ${AIHR_RUNTIME_IMAGE:-aihr-runtime:local}
    environment:
      AIHR_CONFIG_FILE: config/config.Online.ini
      AIHR_SEED_DEMO_DATA: ${AIHR_SEED_DEMO_DATA:-false}
      AIHR_SYNTHETIC_SEED_RECOMMENDATIONS: ${AIHR_SYNTHETIC_SEED_RECOMMENDATIONS:-10000}
      AIHR_SYNTHETIC_SEED_CANDIDATES: ${AIHR_SYNTHETIC_SEED_CANDIDATES:-8000}
      AIHR_SYNTHETIC_SEED_JOBS: ${AIHR_SYNTHETIC_SEED_JOBS:-300}
      AIHR_ASSISTANT_PROVIDER: ${AIHR_ASSISTANT_PROVIDER:-deepseek}
      AIHR_ASSISTANT_BASE_URL: ${AIHR_ASSISTANT_BASE_URL:-https://api.deepseek.com}
      AIHR_ASSISTANT_MODEL: ${AIHR_ASSISTANT_MODEL:-deepseek-chat}
      AIHR_ASSISTANT_API_KEY_FILE: /run/secrets/deepseek_api_key
      AIHR_ASSISTANT_CACHE_TTL_SECONDS: "300"
      AIHR_CACHE_URL: redis://cache:6379/0
      AIHR_ANALYSIS_CONTEXT_CACHE_TTL_SECONDS: "300"
      AIHR_ANALYSIS_PREWARM: "true"
      AIHR_ANALYSIS_QUEUE_ENABLED: "true"
      AIHR_ANALYSIS_QUEUE_NAME: aihr
      AIHR_DATABASE_URL: postgresql+psycopg://${AIHR_POSTGRES_USER:-aihr}@postgres:5432/${AIHR_POSTGRES_DATABASE:-aihr}
      AIHR_DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
      AIHR_MONGO_URL: ${AIHR_MONGO_URL:-mongodb://mongo:27017}
      AIHR_MONGO_DATABASE: ${AIHR_MONGO_DATABASE:-aihr_documents}
      AIHR_CORS_ORIGINS: http://localhost:8501,http://localhost:${AIHR_FRONTEND_HOST_PORT:-5173}
      AIHR_OPERATIONS_TOKEN_FILE: /run/secrets/operations_token
      AIHR_OTEL_EXPORTER_ENDPOINT: http://otel-collector:4318
      AIHR_OTEL_SERVICE_NAME: aihr-api
    volumes:
      - E:/AIHRData/secrets/deepseek_api_key:/run/secrets/deepseek_api_key:ro
      - E:/AIHRData/secrets/operations_token:/run/secrets/operations_token:ro
      - E:/AIHRData/secrets/postgres_password:/run/secrets/postgres_password:ro
    ports:
      - "127.0.0.1:${AIHR_API_HOST_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      cache:
        condition: service_healthy
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/ready')"]
      interval: 5s
      timeout: 5s
      retries: 20
  worker:
    image: aihr-api:local
    command: ["rq", "worker", "--url", "redis://cache:6379/0", "aihr"]
    environment:
      AIHR_CONFIG_FILE: config/config.Online.ini
      AIHR_DATABASE_URL: postgresql+psycopg://${AIHR_POSTGRES_USER:-aihr}@postgres:5432/${AIHR_POSTGRES_DATABASE:-aihr}
      AIHR_DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
      AIHR_CACHE_URL: redis://cache:6379/0
      AIHR_CACHE_PREFIX: aihr
      AIHR_ANALYSIS_CONTEXT_CACHE_TTL_SECONDS: "300"
    volumes:
      - E:/AIHRData/secrets/postgres_password:/run/secrets/postgres_password:ro
    depends_on:
      postgres:
        condition: service_healthy
      cache:
        condition: service_healthy

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.157.0
    command: ["--config=/etc/otelcol/config.yml"]
    volumes:
      - ./ops/observability/otel-collector.yml:/etc/otelcol/config.yml:ro
      - E:/AIHRData/otel:/var/lib/otelcol
    depends_on:
      tempo:
        condition: service_started

  tempo:
    image: grafana/tempo:2.8.2
    command: ["-config.file=/etc/tempo/tempo.yml"]
    ports:
      - "127.0.0.1:${AIHR_TEMPO_HOST_PORT:-3200}:3200"
    volumes:
      - ./ops/observability/tempo.yml:/etc/tempo/tempo.yml:ro
      - E:/AIHRData/tempo:/var/tempo

  prometheus:
    image: prom/prometheus:v3.13.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "127.0.0.1:${AIHR_PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ./ops/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - E:/AIHRData/secrets/operations_token:/run/secrets/operations_token:ro
      - E:/AIHRData/prometheus:/prometheus
    depends_on:
      api:
        condition: service_healthy

  grafana:
    image: grafana/grafana:13.0.2
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:${AIHR_GRAFANA_HOST_PORT:-3000}:3000"
    volumes:
      - E:/AIHRData/grafana:/var/lib/grafana
      - E:/AIHRData/secrets/grafana_admin_password:/run/secrets/grafana_admin_password:ro
      - ./ops/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  dashboard:
    image: aihr-dashboard:local
    pull_policy: build
    build:
      context: .
      dockerfile: Dockerfile.app
      args:
        RUNTIME_IMAGE: ${AIHR_RUNTIME_IMAGE:-aihr-runtime:local}
    environment:
      AIHR_CONFIG_FILE: config/config.Online.ini
      AIHR_API_URL: http://api:8000/api/v1
    ports:
      - "127.0.0.1:${AIHR_DASHBOARD_HOST_PORT:-8501}:8501"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 5s
      timeout: 5s
      retries: 20

  frontend:
    image: aihr-frontend:local
    pull_policy: build
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_AIHR_API_URL: http://localhost:${AIHR_API_HOST_PORT:-8000}/api/v1
    ports:
      - "127.0.0.1:${AIHR_FRONTEND_HOST_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 5s
      timeout: 5s
      retries: 20
