services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: aihr
      MYSQL_USER: aihr
      MYSQL_PASSWORD: CHANGE_ME
      MYSQL_ROOT_PASSWORD: CHANGE_ME
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      AIHR_CONFIG_FILE: config/config.Online.ini
      AIHR_SEED_DEMO_DATA: "true"
      AIHR_ASSISTANT_PROVIDER: ${AIHR_ASSISTANT_PROVIDER:-deepseek}
      AIHR_ASSISTANT_BASE_URL: ${AIHR_ASSISTANT_BASE_URL:-https://api.deepseek.com}
      AIHR_ASSISTANT_MODEL: ${AIHR_ASSISTANT_MODEL:-deepseek-chat}
      AIHR_ASSISTANT_API_KEY: ${AIHR_ASSISTANT_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/ready')"]
      interval: 5s
      timeout: 5s
      retries: 20

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.app
    environment:
      AIHR_CONFIG_FILE: config/config.Online.ini
      AIHR_API_URL: http://api:8000/api/v1
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
