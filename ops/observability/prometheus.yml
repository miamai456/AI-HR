global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: aihr-api
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/operations_token
    static_configs:
      - targets: ["api:8000"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
