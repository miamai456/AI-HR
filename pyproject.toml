[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aihr-analytics"
version = "0.1.0"
description = "AI recruitment recommendation effectiveness and monitoring system"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic>=2.0,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "pymysql>=1.1,<2.0",
  "pandas>=2.0,<4.0",
  "pyarrow>=15.0,<25.0",
  "numpy>=1.24,<3.0",
  "scipy>=1.10,<2.0",
  "statsmodels>=0.14,<1.0",
  "scikit-learn>=1.3,<2.0",
  "streamlit>=1.40,<2.0",
  "plotly>=5.24,<7.0",
  "requests>=2.31,<3.0",
  "redis>=5.0,<6.0",
  "alembic>=1.14,<2.0",
  "prometheus-client>=0.21,<1.0",
  "rq>=2.1,<3.0",
  "opentelemetry-api>=1.30,<2.0",
  "opentelemetry-sdk>=1.30,<2.0",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2.0",
  "opentelemetry-instrumentation-fastapi>=0.51b0,<1.0",
  "opentelemetry-instrumentation-requests>=0.51b0,<1.0",
  "sqlglot>=25.20,<27.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "httpx2>=2.9,<3.0",
  "pytest>=8.0,<10.0",
  "ruff>=0.8,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
